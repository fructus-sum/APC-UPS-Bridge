name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          go test ./...
          go vet ./...
          bash scripts/test-install.sh
      - name: Build all Linux binaries
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}" dist
      - name: Publish checksummed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --title "APC UPS Bridge ${GITHUB_REF_NAME}" --generate-notes
